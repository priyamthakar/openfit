name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Manual re-run: choose the tag (e.g. v1.0.1) in "Use workflow from".
  workflow_dispatch:

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml version: $pkg_version, tag: $tag_version"
          test "$pkg_version" = "$tag_version"

      - name: Run test suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,reports,cli]"
          python -m pytest -q

      - name: Build wheel and sdist
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Must match the "Environment name" entered in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/openfit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
